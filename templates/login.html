<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - WMS</title>
  <style>
    body { margin:0; font-family:system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background:#f4f6f8; display:flex; min-height:100vh; align-items:center; justify-content:center; }
    .card { width:92%; max-width:420px; background:#fff; border-radius:14px; padding:22px; box-shadow:0 10px 30px rgba(0,0,0,0.12); }
    h1 { margin:0 0 12px; font-size:22px; }
    .muted { color:#6c757d; font-size:13px; margin-bottom:14px; }
    label { display:block; font-size:13px; font-weight:800; margin:12px 0 6px; }
    input { width:100%; padding:10px 10px; border:1px solid #d8dde3; border-radius:10px; box-sizing:border-box; font-size:14px; }
    button { margin-top:16px; width:100%; padding:10px 12px; border:none; border-radius:10px; background:#2d7ef7; color:#fff; font-weight:800; cursor:pointer; }
    .error { margin-top:12px; background:#ffe9e9; border:1px solid #ffcccc; color:#b42318; padding:10px 12px; border-radius:10px; font-size:13px; }
    .note { margin-top:12px; color:#6c757d; font-size:12px; }
    code { background:#f1f3f5; padding:2px 6px; border-radius:6px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>WMS Login</h1>
    <div class="muted">Use your credentials to access the warehouse dashboard.</div>

    <form method="POST">
      <label>Username</label>
      <input name="username" autocomplete="username" required/>

      <label>Password</label>
      <input name="password" type="password" autocomplete="current-password" required/>

      <button type="submit">Sign in</button>
    </form>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    <div class="note">
      Default admin (if you did not set env vars): <code>admin / admin123</code><br/>
      You can set <code>ADMIN_USERNAME</code> and <code>ADMIN_PASSWORD</code> on Render later.
    </div>
  </div>
</body>
</html>
