<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ 'Rejestracja' if register_mode else 'Logowanie' }}</title>
  <style>
    body{font-family:system-ui,-apple-system,sans-serif;background:#0b1220;color:#e5e7eb;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
    .card{width:min(400px,90vw);background:#0f172a;border:1px solid #24324a;border-radius:16px;padding:25px;box-shadow:0 20px 50px rgba(0,0,0,0.4)}
    h1{margin:0 0 20px 0;font-size:24px;text-align:center}
    label{display:block;margin-bottom:8px;font-weight:600}
    input{width:100%;padding:12px;margin-bottom:15px;border-radius:8px;border:1px solid #2b3a55;background:#0b1324;color:#fff;box-sizing:border-box}
    button{width:100%;padding:12px;border-radius:8px;border:0;background:#2563eb;color:white;font-weight:700;cursor:pointer}
    .error{background:#450a0a;color:#fecaca;padding:10px;border-radius:8px;margin-bottom:15px;font-size:14px}
    .switch{margin-top:20px;text-align:center;font-size:14px}
    .switch a{color:#3b82f6;text-decoration:none}
  </style>
</head>
<body>
  <div class="card">
    <h1>{{ 'Nowe konto' if register_mode else 'BTVenlo Storage' }}</h1>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="POST" action="{{ url_for('register') if register_mode else url_for('login') }}">
      <label>Użytkownik</label>
      <input type="text" name="username" required autofocus>
      <label>Hasło</label>
      <input type="password" name="password" required>
      <button type="submit">{{ 'Zarejestruj się' if register_mode else 'Zaloguj' }}</button>
    </form>
    <div class="switch">
      {% if register_mode %}
        Masz już konto? <a href="{{ url_for('login') }}">Zaloguj się</a>
      {% else %}
        Nowy pracownik? <a href="{{ url_for('register') }}">Załóż konto</a>
      {% endif %}
    </div>
  </div>
</body>
</html>
