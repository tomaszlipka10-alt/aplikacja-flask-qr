<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#0b1220;color:#e5e7eb;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
    .card{width:min(420px,92vw);background:#0f172a;border:1px solid #24324a;border-radius:16px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
    h1{margin:0 0 14px 0;font-size:26px}
    .hint{opacity:.8;margin:0 0 16px 0}
    label{display:block;margin-top:10px;margin-bottom:6px;font-weight:600}
    input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #2b3a55;background:#0b1324;color:#e5e7eb}
    button{margin-top:16px;width:100%;padding:10px 12px;border-radius:10px;border:0;background:#2563eb;color:white;font-weight:700;cursor:pointer}
    .error{margin-top:12px;background:#3b0a0a;border:1px solid #7f1d1d;color:#fecaca;padding:10px 12px;border-radius:10px}
    .note{margin-top:14px;font-size:12px;opacity:.85}
    code{background:#111827;border:1px solid #24324a;border-radius:8px;padding:2px 6px}
  </style>
</head>
<body>
  <div class="card">
    <h1 id="formTitle">Login</h1>
    <p class="hint" id="formHint">Sign in to your WMS.</p>

    <form id="authForm" method="post" action="{{ url_for('login') }}">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />

      <button type="submit" id="submitBtn">Sign in</button>
      <button type="button" id="toggleBtn" style="background:transparent; border:1px solid #24324a; margin-top:8px">Create new account</button>
    </form>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    <div class="note">
      Default admin (auto-created if missing): <code>admin</code> / <code>admin123</code>
    </div>
  </div>
<script>
  const toggleBtn = document.getElementById('toggleBtn');
  const authForm = document.getElementById('authForm');
  const formTitle = document.getElementById('formTitle');
  const formHint = document.getElementById('formHint');
  const submitBtn = document.getElementById('submitBtn');

  toggleBtn.onclick = () => {
    if (authForm.action.includes('login')) {
      authForm.action = "{{ url_for('register') }}";
      formTitle.innerText = 'Register';
      formHint.innerText = 'Create a new operator account.';
      submitBtn.innerText = 'Create Account';
      toggleBtn.innerText = 'Back to Login';
    } else {
      authForm.action = "{{ url_for('login') }}";
      formTitle.innerText = 'Login';
      formHint.innerText = 'Sign in to your WMS.';
      submitBtn.innerText = 'Sign in';
      toggleBtn.innerText = 'Create new account';
    }
  };
</script>
</body>
</html>
