<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#0b1220;color:#e5e7eb;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
    .card{width:min(420px,92vw);background:#0f172a;border:1px solid #24324a;border-radius:16px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
    h1{margin:0 0 14px 0;font-size:26px}
    .hint{opacity:.8;margin:0 0 16px 0}
    label{display:block;margin-top:10px;margin-bottom:6px;font-weight:600}
    input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #2b3a55;background:#0b1324;color:#e5e7eb}
    button{margin-top:16px;width:100%;padding:10px 12px;border-radius:10px;border:0;background:#2563eb;color:white;font-weight:700;cursor:pointer}
    .error{margin-top:12px;background:#3b0a0a;border:1px solid #7f1d1d;color:#fecaca;padding:10px 12px;border-radius:10px}
    .note{margin-top:14px;font-size:12px;opacity:.85}
    code{background:#111827;border:1px solid #24324a;border-radius:8px;padding:2px 6px}
  </style>
</head>
<body>
  <div class="card">
    <h1>Login</h1>
    <p class="hint">Sign in to your WMS.</p>

    <form method="post" action="{{ url_for('login') }}">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />

      <button type="submit">Sign in</button>
    </form>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    <div class="note">
      Default admin (auto-created if missing): <code>admin</code> / <code>admin123</code>
    </div>
  </div>
</body>
</html>
