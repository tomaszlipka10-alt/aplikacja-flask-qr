<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login</title>
  <style>
    body { margin:0; font-family: Arial, sans-serif; background:#f5f6f8; display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .card { width:420px; max-width:92vw; background:#fff; border-radius:16px; padding:22px; box-shadow:0 10px 24px rgba(0,0,0,.08); }
    h1 { margin:0 0 14px 0; font-size:22px; }
    .row { margin:10px 0; }
    input { width:100%; padding:12px; border-radius:12px; border:1px solid #d7dbe2; box-sizing:border-box; }
    button { width:100%; padding:12px; border-radius:12px; border:0; background:#0b61ff; color:#fff; font-weight:800; cursor:pointer; margin-top:10px; }
    .err { background:#ffecec; color:#8a0014; padding:10px 12px; border-radius:12px; margin-bottom:12px; }
    .muted { color:#667085; font-size:13px; margin-top:12px; }
    code { background:#f1f3f6; padding:2px 6px; border-radius:8px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Login</h1>
    {% if error %}
      <div class="err">{{ error }}</div>
    {% endif %}
    <form method="POST">
      <div class="row"><input name="username" placeholder="Username" required /></div>
      <div class="row"><input name="password" type="password" placeholder="Password" required /></div>
      <button type="submit">Sign in</button>
    </form>
    <div class="muted">
      Default admin: <code>admin</code> / <code>admin123</code> (change via env <code>ADMIN_PASSWORD</code>).
    </div>
  </div>
</body>
</html>
