<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BTVenloStorage</title>
  <style>
    :root{ --bg: #ffffff; --text: #0b1b3a; --border: rgba(17, 41, 84, .12); --blue: #2563eb; --sidebar: #0f2a5f; --radius: 16px; }
    *{box-sizing:border-box}
    body{margin:0; font-family: system-ui, sans-serif; background: var(--bg); display:flex; min-height:100vh;}
    .sidebar{width:72px; background: var(--sidebar); color:#fff; display:flex; flex-direction:column; align-items:center; padding:20px 0; gap:15px; position:fixed; height:100vh;}
    .navbtn{width:48px; height:48px; border-radius:12px; border:none; background: rgba(255,255,255,.1); color:#fff; cursor:pointer; font-size:20px;}
    .navbtn.active{background: var(--blue);}
    .main{margin-left:72px; flex:1;}
    .topbar{padding:15px 25px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; background:#fff; position:sticky; top:0; z-index:10;}
    .search-btn{font-size:24px; cursor:pointer; background:none; border:none;}
    .container{padding:25px; max-width:1100px; margin:0 auto;}
    .card{background:#fff; border:1px solid var(--border); border-radius:var(--radius); padding:20px; box-shadow: 0 4px 20px rgba(0,0,0,.05); margin-bottom:20px;}
    .btn{padding:12px 20px; border-radius:10px; border:1px solid var(--border); cursor:pointer; font-weight:600;}
    .btn-primary{background:var(--blue); color:#fff; border:none;}
    table{width:100%; border-collapse:collapse;}
    th,td{text-align:left; padding:14px; border-bottom:1px solid var(--border);}
    .modal-backdrop{position:fixed; inset:0; background:rgba(0,0,0,.4); display:none; align-items:center; justify-content:center; z-index:100;}
    .modal{background:#fff; width:min(450px, 90%); border-radius:20px; padding:25px;}
    input{width:100%; padding:14px; border-radius:12px; border:1px solid var(--border); margin-bottom:15px; font-size:16px;}
  </style>
</head>
<body>
  <nav class="sidebar">
    <button class="navbtn active" onclick="showView('dashboard')">🏠</button>
    <button class="navbtn" onclick="showView('inventory')">📦</button>
    <button class="navbtn" onclick="showView('audit')">🕒</button>
    <button class="navbtn" onclick="showView('admin')">⚙️</button>
    <button class="navbtn" style="margin-top:auto" onclick="location.href='/logout'">🚪</button>
  </nav>

  <main class="main">
    <header class="topbar">
      <strong>BTVenlo Storage</strong>
      <button class="search-btn" title="Search Inventory" onclick="openSearch()">🔍</button>
    </header>

    <div class="container">
      <section id="view-dashboard" class="view">
        <div class="card">
          <h2>Stock Actions</h2>
          <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:15px;">
            <button class="btn btn-primary" style="padding:40px;" onclick="openModal('add')">➕ Add New Product</button>
            <button class="btn" style="padding:40px;" onclick="openModal('receive')">⬇️ Receive Stock</button>
            <button class="btn" style="padding:40px;" onclick="openModal('issue')">⬆️ Issue Stock</button>
          </div>
        </div>
      </section>

      <section id="view-inventory" class="view" style="display:none">
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <h2>Inventory</h2>
            <input id="tableSearch" placeholder="Filter..." style="width:200px; margin:0;" onkeyup="filterTable()">
          </div>
          <table>
            <thead><tr><th>SKU</th><th>Name</th><th>Stock</th><th>Location</th></tr></thead>
            <tbody id="prodTable"></tbody>
          </table>
        </div>
      </section>

      <section id="view-audit" class="view" style="display:none">
        <div class="card"><h2>Audit Logs</h2><table><thead><tr><th>Date</th><th>Action</th><th>SKU</th><th>Qty</th></tr></thead><tbody id="auditTable"></tbody></table></div>
      </section>
      
      <section id="view-admin" class="view" style="display:none">
        <div class="card"><h2>Admin</h2><button class="btn btn-primary">Run Backup</button></div>
      </section>
    </div>
  </main>

  <div id="modal" class="modal-backdrop">
    <div class="modal">
      <h2 id="modalTitle">Action</h2>
      <div id="f-add" style="display:none">
        <input id="p_sku" placeholder="SKU (Scan now)">
        <input id="p_name" placeholder="Name">
        <input id="p_qty" type="number" placeholder="Qty">
        <input id="p_loc" placeholder="Location">
      </div>
      <div id="f-stock" style="display:none">
        <input id="s_sku" placeholder="SKU (Scan now)">
        <input id="s_qty" type="number" placeholder="Amount">
      </div>
      <div id="f-search" style="display:none">
        <input id="searchQuery" placeholder="Search SKU / Name..." onkeyup="handleQuickSearch()">
      </div>
      <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:10px;">
        <button class="btn" onclick="closeModal()">Cancel</button>
        <button id="confirmBtn" class="btn btn-primary" onclick="handleSave()">Confirm</button>
      </div>
    </div>
  </div>

  <script>
    let mode = '';
    let buffer = "";
    let lastTime = 0;

    window.addEventListener("keydown", (e) => {
      const now = Date.now();
      if (now - lastTime > 100) buffer = "";
      lastTime = now;
      if (e.key === "Enter") {
        if (buffer.length > 1) { handleScan(buffer); buffer = ""; }
      } else if (e.key.length === 1) { buffer += e.key; }
    });

    function handleScan(text) {
      if (mode === 'search') {
        document.getElementById('searchQuery').value = text;
        handleQuickSearch();
      } else {
        const isAdd = (mode === 'add');
        const skuInput = isAdd ? document.getElementById('p_sku') : document.getElementById('s_sku');
        if (text.includes("|")) {
          const p = text.split("|");
          skuInput.value = p[0].trim();
          if(isAdd && p[1]) document.getElementById('p_name').value = p[1].trim();
        } else {
          skuInput.value = text.trim();
        }
      }
    }

    function openSearch() {
      mode = 'search';
      document.getElementById('modalTitle').innerText = 'Search Inventory';
      document.querySelectorAll('#modal div[id^="f-"]').forEach(d => d.style.display = 'none');
      document.getElementById('f-search').style.display = 'block';
      document.getElementById('confirmBtn').style.display = 'none';
      document.getElementById('modal').style.display = 'flex';
      setTimeout(() => document.getElementById('searchQuery').focus(), 100);
    }

    function handleQuickSearch() {
      const q = document.getElementById('searchQuery').value.toLowerCase();
      if (q.length > 2) {
        closeModal();
        showView('inventory');
        document.getElementById('tableSearch').value = q;
        filterTable();
      }
    }

    function filterTable() {
      const q = document.getElementById('tableSearch').value.toLowerCase();
      document.querySelectorAll('#prodTable tr').forEach(row => {
        row.style.display = row.innerText.toLowerCase().includes(q) ? '' : 'none';
      });
    }

    function showView(v) {
      document.querySelectorAll('.view').forEach(e => e.style.display = 'none');
      document.querySelectorAll('.navbtn').forEach(b => b.classList.remove('active'));
      document.getElementById('view-' + v).style.display = 'block';
      if(v === 'inventory') loadProducts();
      if(v === 'audit') loadAudit();
    }

    function openModal(m) {
      mode = m;
      document.getElementById('modalTitle').innerText = m.toUpperCase();
      document.getElementById('f-add').style.display = m === 'add' ? 'block' : 'none';
      document.getElementById('f-stock').style.display = (m === 'receive' || m === 'issue') ? 'block' : 'none';
      document.getElementById('f-search').style.display = 'none';
      document.getElementById('confirmBtn').style.display = 'block';
      document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('modal').style.display = 'none'; }

    async function loadProducts() {
      const res = await fetch('/api/products');
      const j = await res.json();
      document.getElementById('prodTable').innerHTML = j.data.map(p => `<tr><td>${p.item_number}</td><td>${p.name}</td><td>${p.current_stock}</td><td>${p.location}</td></tr>`).join('');
      filterTable();
    }

    async function loadAudit() {
      const res = await fetch('/api/audit');
      const j = await res.json();
      document.getElementById('auditTable').innerHTML = j.data.map(a => `<tr><td>${a.created_at ? a.created_at.split('T')[0] : ''}</td><td>${a.action}</td><td>${a.product_sku}</td><td>${a.amount}</td></tr>`).join('');
    }

    async function handleSave() {
      let body = {}, url = '';
      if (mode === 'add') {
        url = '/api/products';
        body = { item_number: document.getElementById('p_sku').value, name: document.getElementById('p_name').value, current_stock: document.getElementById('p_qty').value, location: document.getElementById('p_loc').value };
      } else {
        url = `/api/stock/${mode}`;
        body = { item_number: document.getElementById('s_sku').value, amount: document.getElementById('s_qty').value };
      }
      const res = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
      if(res.ok) { closeModal(); loadProducts(); } else { alert("Error!"); }
    }
  </script>
</body>
</html>
