<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BTVenloStorage</title>
  <style>
    :root{ --bg: #f8fafc; --text: #0f172a; --blue: #2563eb; --border: #e2e8f0; --shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    body{ margin:0; font-family: sans-serif; background: var(--bg); color: var(--text); display:flex; }
    .sidebar{ width:70px; background: #1e293b; height:100vh; display:flex; flex-direction:column; align-items:center; padding-top:20px; gap:20px; position:fixed; }
    .navbtn{ background:none; border:none; font-size:24px; cursor:pointer; padding:10px; border-radius:10px; color:#94a3b8; }
    .navbtn.active{ color:#fff; background: #334155; }
    .main{ margin-left:70px; flex:1; padding:20px; }
    .card{ background:#fff; padding:20px; border-radius:12px; box-shadow:var(--shadow); border:1px solid var(--border); margin-bottom:20px; }
    .btn{ padding:10px 20px; border-radius:8px; border:none; cursor:pointer; font-weight:600; }
    .btn-primary{ background:var(--blue); color:#fff; }
    table{ width:100%; border-collapse:collapse; margin-top:10px; }
    th, td{ text-align:left; padding:12px; border-bottom:1px solid var(--border); }
    .modal{ position:fixed; inset:0; background:rgba(0,0,0,0.5); display:none; align-items:center; justify-content:center; }
    .modal-content{ background:#fff; padding:25px; border-radius:15px; width:400px; }
    input{ width:100%; padding:12px; margin:10px 0; border:1px solid var(--border); border-radius:8px; box-sizing:border-box; }
  </style>
</head>
<body>
  <nav class="sidebar">
    <button class="navbtn active" onclick="showView('dashboard')">🏠</button>
    <button class="navbtn" onclick="showView('inventory')">📦</button>
    <button class="navbtn" onclick="showView('audit')">🕒</button>
    <button class="navbtn" onclick="showView('admin')">⚙️</button>
    <button class="navbtn" onclick="location.href='/logout'" style="margin-top:auto; margin-bottom:20px;">🚪</button>
  </nav>

  <main class="main">
    <section id="dashboard" class="view">
      <div class="card">
        <h1>BTVenlo Storage</h1>
        <div style="display:flex; gap:10px;">
          <button class="btn btn-primary" onclick="openModal('add')">Add Product</button>
          <button class="btn" onclick="openModal('receive')">Receive Stock</button>
          <button class="btn" onclick="openModal('issue')">Issue Stock</button>
        </div>
      </div>
    </section>

    <section id="inventory" class="view" style="display:none">
      <div class="card">
        <h2>Inventory</h2>
        <table>
          <thead><tr><th>SKU</th><th>Name</th><th>Stock</th><th>Location</th></tr></thead>
          <tbody id="prodTable"></tbody>
        </table>
      </div>
    </section>

    <section id="audit" class="view" style="display:none">
      <div class="card">
        <h2>Audit Logs</h2>
        <table>
          <thead><tr><th>Date</th><th>SKU</th><th>Action</th><th>Qty</th><th>User</th></tr></thead>
          <tbody id="auditTable"></tbody>
        </table>
      </div>
    </section>

    <section id="admin" class="view" style="display:none">
      <div class="card">
        <h2>Admin Tools</h2>
        <button class="btn btn-primary" onclick="runBackup()">Backup to GitHub</button>
      </div>
    </section>
  </main>

  <div id="modal" class="modal">
    <div class="modal-content">
      <h2 id="modalTitle">Stock Action</h2>
      <div id="modalAddFields">
        <input id="in_sku" placeholder="SKU (Scan here)">
        <input id="in_name" placeholder="Product Name">
        <input id="in_qty" type="number" placeholder="Initial Qty / Change Amount">
        <input id="in_loc" placeholder="Location">
      </div>
      <div style="display:flex; gap:10px; justify-content:flex-end;">
        <button class="btn" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="handleSave()">Execute</button>
      </div>
    </div>
  </div>

  <script>
    let mode = '';
    let barcodeBuffer = "";
    let lastKeyTime = 0;

    // --- SCANNER LOGIC ---
    window.addEventListener("keydown", (e) => {
      const now = Date.now();
      if (now - lastKeyTime > 100) barcodeBuffer = "";
      lastKeyTime = now;
      if (e.key === "Enter") {
        if (barcodeBuffer.length > 2) {
          processBarcode(barcodeBuffer);
          barcodeBuffer = "";
        }
      } else if (e.key.length === 1) {
        barcodeBuffer += e.key;
      }
    });

    function processBarcode(text) {
      if (text.includes("|")) {
        const parts = text.split("|");
        document.getElementById("in_sku").value = parts[0].trim();
        if(parts[1]) document.getElementById("in_name").value = parts[1].trim();
      } else {
        document.getElementById("in_sku").value = text.trim();
      }
    }

    function showView(v) {
      document.querySelectorAll('.view').forEach(e => e.style.display = 'none');
      document.getElementById(v).style.display = 'block';
      if(v === 'inventory') loadProducts();
      if(v === 'audit') loadAudit();
    }

    function openModal(m) {
      mode = m;
      document.getElementById('modalTitle').innerText = m.toUpperCase();
      document.getElementById('in_name').style.display = m === 'add' ? 'block' : 'none';
      document.getElementById('in_loc').style.display = m === 'add' ? 'block' : 'none';
      document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('modal').style.display = 'none'; }

    async function loadProducts() {
      const res = await fetch('/api/products');
      const j = await res.json();
      document.getElementById('prodTable').innerHTML = j.data.map(p => `<tr><td>${p.item_number}</td><td>${p.name}</td><td>${p.current_stock}</td><td>${p.location}</td></tr>`).join('');
    }

    async function loadAudit() {
      const res = await fetch('/api/audit');
      const j = await res.json();
      document.getElementById('auditTable').innerHTML = j.data.map(a => `<tr><td>${a.created_at.split('T')[0]}</td><td>${a.product_sku}</td><td>${a.action}</td><td>${a.amount}</td><td>${a.username}</td></tr>`).join('');
    }

    async function handleSave() {
      const sku = document.getElementById('in_sku').value;
      const qty = document.getElementById('in_qty').value;
      
      if(mode === 'add') {
        const res = await fetch('/api/products', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({item_number: sku, name: document.getElementById('in_name').value, current_stock: qty, location: document.getElementById('in_loc').value})
        });
        if(res.ok) { alert('Added'); closeModal(); }
      } else {
        const res = await fetch(`/api/stock/${mode}`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({item_number: sku, amount: qty})
        });
        if(res.ok) { alert('Updated'); closeModal(); }
        else { alert('Error: Check SKU or Stock'); }
      }
    }

    async function runBackup() {
      const res = await fetch('/api/admin/backup/github', {method: 'POST'});
      const j = await res.json();
      alert(j.message);
    }
  </script>
</body>
</html>
