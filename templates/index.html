<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BTVenloStorage</title>
  <style>
    :root{
      --bg: #ffffff;
      --card: #ffffff;
      --text: #0b1b3a;
      --muted: #5b6a88;
      --border: rgba(17, 41, 84, .12);
      --blue-700: #1d4ed8;
      --blue-600: #2563eb;
      --blue-500: #3b82f6;
      --blue-100: #eaf2ff;
      --sidebar: #0f2a5f;
      --sidebar2:#123372;
      --shadow: 0 10px 30px rgba(10, 25, 60, .10);
      --radius: 16px;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      color:var(--text);
      background: var(--bg);
    }

    .app{display:flex; min-height:100vh;}

    .sidebar{
      position:sticky;
      top:0;
      height:100vh;
      width:72px;
      flex: 0 0 72px;
      background: linear-gradient(180deg, var(--sidebar), var(--sidebar2));
      color:#fff;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:10px 8px;
      gap:10px;
    }

    .nav{
      width:100%;
      display:flex;
      flex-direction:column;
      gap:10px;
      margin-top:6px;
      flex: 1;
      align-items:center;
    }

    .navbtn{
      width:52px;
      height:52px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      user-select:none;
      font-size:22px;
      transition: transform .05s ease, background .15s ease;
    }
    .navbtn:active{transform:scale(.98)}
    .navbtn:hover{background: rgba(255,255,255,.10)}
    .navbtn.active{background: rgba(59,130,246,.26); border-color: rgba(255,255,255,.22)}

    .navbottom{width:100%; display:flex; flex-direction:column; gap:10px; align-items:center; padding-bottom:6px;}

    .main{flex:1; min-width:0;}

    .topbar{
      position:sticky;
      top:0;
      z-index:10;
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(10px);
      border-bottom:1px solid var(--border);
    }

    .topbar-inner{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:14px 16px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .search-container {
      position: relative;
      display: flex;
      align-items: center;
    }
    .search-container input {
      padding: 10px 15px 10px 38px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #f1f5f9;
      outline: none;
      width: 220px;
      font-size: 14px;
      transition: width 0.3s;
    }
    .search-container input:focus {
      width: 280px;
      border-color: var(--blue-500);
      background: #fff;
    }
    .search-container::before {
      content: "🔍";
      position: absolute;
      left: 12px;
      font-size: 14px;
      opacity: 0.5;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      font-weight:800;
      letter-spacing:.2px;
      font-size:20px;
    }

    .brand-dot{
      width:12px;height:12px;border-radius:999px;
      background: var(--blue-600);
      box-shadow: 0 0 0 5px rgba(37,99,235,.18);
    }

    .container{
      max-width:1100px;
      margin: 0 auto;
      padding:16px;
    }

    .card{
      background: var(--card);
      border:1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding:24px;
    }

    .card h2{margin:0 0 20px; font-size:22px; text-align:center}

    /* ŚRODKOWANIE KAFELKÓW */
    .pillgrid{
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 320px));
      gap:16px;
      justify-content: center; /* Centrowanie kafelków */
    }

    .pill{
      display:flex;
      align-items:center;
      padding:20px;
      border:1px solid var(--border);
      border-radius: 14px;
      background: #fff;
      cursor:pointer;
      font-weight:700;
      transition: 0.2s;
    }
    .pill:hover{background: var(--blue-100); border-color: var(--blue-500)}

    .pill .left{display:flex; align-items:center; gap:14px}
    .pill .ic{width:40px;height:40px;border-radius:12px;background: var(--blue-100); display:flex;align-items:center;justify-content:center; font-size:20px}

    .modal-backdrop{
      position:fixed; inset:0; background: rgba(10,25,60,.35);
      display:none; align-items:center; justify-content:center; z-index:50; padding:16px;
    }
    .modal{
      width: min(560px, 100%); background:#fff; border-radius: 18px;
      border:1px solid var(--border); box-shadow: 0 20px 60px rgba(0,0,0,.18);
    }
    .modal-header{
      display:flex; align-items:center; justify-content:space-between;
      padding:14px 16px; border-bottom:1px solid var(--border);
    }
    .modal-body{padding:20px}
    .row{display:grid; grid-template-columns: 1fr; gap:12px; margin-bottom:12px}
    label{font-size:12px; color:var(--muted); font-weight:700; text-transform: uppercase}
    input{
      width:100%; padding:12px; border-radius: 12px; border:1px solid var(--border);
      outline:none; font-size:14px;
    }
    .scanrow{display:flex; gap:10px}
    .scanrow input{flex:1}
    .btn{padding:10px 16px; border-radius:10px; border:1px solid var(--border); background:#fff; cursor:pointer; font-weight:600}
    .btn.primary{background:var(--blue-600); color:#fff; border:none}

    .scanner{display:none; margin-top:12px; border-radius: 14px; overflow:hidden; background:#000}
    video{width:100%; height:auto; display:block}
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="nav">
      <button class="navbtn active" id="nav-dashboard" onclick="showView('dashboard')">🏠</button>
      <button class="navbtn" id="nav-inventory" onclick="showView('inventory')">📦</button>
      <button class="navbtn" id="nav-audit" onclick="showView('audit')">✅</button>
      <button class="navbtn" id="nav-admin" onclick="showView('admin')">⚙️</button>
    </div>
    <div class="navbottom">
      <button class="navbtn" onclick="logout()">🚪</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <span class="brand-dot"></span>
          <span>BTVenloStorage</span>
        </div>
        <div class="search-container">
          <input type="text" id="topSearch" placeholder="Search SKU or Name..." onkeyup="filterInventory()">
        </div>
      </div>
    </header>

    <div class="container">
      <section id="view-dashboard" class="view">
        <div class="card">
          <h2>Dashboard</h2>
          <div class="pillgrid">
            <div class="pill" onclick="openAddProductModal()">
              <div class="left"><div class="ic">➕</div><div>Add Product</div></div>
            </div>
            <div class="pill" onclick="openStockModal('receive')">
              <div class="left"><div class="ic">⬇️</div><div>Incoming Material</div></div>
            </div>
            <div class="pill" onclick="openStockModal('issue')">
              <div class="left"><div class="ic">⬆️</div><div>Outgoing Material</div></div>
            </div>
            <div class="pill" onclick="comingSoon('Picking lists')">
              <div class="left"><div class="ic">📋</div><div>Picking Lists</div></div>
            </div>
          </div>
        </div>
      </section>

      <section id="view-inventory" class="view" style="display:none">
        <div class="card">
          <h2>Stock Inventory</h2>
          <div style="overflow:auto">
            <table style="width:100%; border-collapse:collapse; font-size:14px" id="invTable">
              <thead>
                <tr style="text-align:left; color:var(--muted)">
                  <th style="padding:12px 8px; border-bottom:2px solid var(--border)">SKU / ID</th>
                  <th style="padding:12px 8px; border-bottom:2px solid var(--border)">Product Name</th>
                  <th style="padding:12px 8px; border-bottom:2px solid var(--border)">Qty</th>
                  <th style="padding:12px 8px; border-bottom:2px solid var(--border)">Location</th>
                </tr>
              </thead>
              <tbody id="productsBody"></tbody>
            </table>
          </div>
        </div>
      </section>

      <section id="view-audit" class="view" style="display:none">
        <div class="card">
          <h2>Activity Log</h2>
          <div style="overflow:auto">
            <table style="width:100%; border-collapse:collapse; font-size:14px">
              <thead>
                <tr style="text-align:left; color:var(--muted)">
                  <th style="padding:12px 8px; border-bottom:2px solid var(--border)">Time</th>
                  <th style="padding:12px 8px; border-bottom:2px solid var(--border)">Action</th>
                  <th style="padding:12px 8px; border-bottom:2px solid var(--border)">ID</th>
                  <th style="padding:12px 8px; border-bottom:2px solid var(--border)">Qty</th>
                  <th style="padding:12px 8px; border-bottom:2px solid var(--border)">User</th>
                </tr>
              </thead>
              <tbody id="auditBody"></tbody>
            </table>
          </div>
        </div>
      </section>

      <section id="view-admin" class="view" style="display:none">
        <div class="card">
          <h2>Admin Settings</h2>
          <button class="btn" onclick="backupToGitHub()">Backup to GitHub</button>
          <div class="alert" id="adminAlert"></div>
        </div>
      </section>
    </div>

    <div class="modal-backdrop" id="addProductBackdrop">
      <div class="modal">
        <div class="modal-header">
          <div class="modal-title">Create New Product</div>
          <button class="btn" onclick="closeAddProductModal()">✕</button>
        </div>
        <div class="modal-body">
          <div class="row">
            <label>Product SKU / ID</label>
            <div class="scanrow">
              <input id="p_id" placeholder="Scan or enter ID">
              <button class="btn" onclick="startScan('product')">📷 Scan</button>
            </div>
            <label>Product Name</label>
            <input id="p_name" placeholder="Enter name">
            <label>Initial Quantity</label>
            <input id="p_qty" type="number" value="0">
            <label>Storage Location</label>
            <input id="p_loc" placeholder="MAG-1">
          </div>
          <div class="scanner" id="scannerBox"><video id="video" playsinline></video></div>
        </div>
        <div class="modal-footer">
          <button class="btn primary" onclick="saveProduct()">Create Product</button>
        </div>
      </div>
    </div>

    <div class="modal-backdrop" id="stockBackdrop">
      <div class="modal">
        <div class="modal-header">
          <div class="modal-title" id="stockTitle">Stock Operation</div>
          <button class="btn" onclick="closeStockModal()">✕</button>
        </div>
        <div class="modal-body">
          <div class="row">
            <label>Product SKU / ID</label>
            <div class="scanrow">
              <input id="s_id" placeholder="Scan or enter ID">
              <button class="btn" onclick="startScanStock('s_id')">📷 Scan</button>
            </div>
            <label>Quantity</label>
            <input id="s_qty" type="number" placeholder="Enter amount">
          </div>
          <div class="scanner" id="stockScannerBox"><video id="stockVideo" playsinline></video></div>
        </div>
        <div class="modal-footer">
          <button class="btn primary" onclick="submitStock()">Confirm Change</button>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
  function showView(name){
    const views = ['dashboard','inventory','audit','admin'];
    views.forEach(v => {
      document.getElementById('view-'+v).style.display = (v===name) ? 'block' : 'none';
      document.getElementById('nav-'+v).classList.toggle('active', v===name);
    });
    if (name === 'inventory') loadProducts();
    if (name === 'audit') loadAudit();
  }

  function filterInventory() {
    let input = document.getElementById("topSearch");
    let filter = input.value.toUpperCase();
    if (filter.length > 0 && document.getElementById('view-dashboard').style.display !== 'none') {
      showView('inventory');
    }
    let table = document.getElementById("productsBody");
    let tr = table.getElementsByTagName("tr");
    for (let i = 0; i < tr.length; i++) {
      let td0 = tr[i].getElementsByTagName("td")[0];
      let td1 = tr[i].getElementsByTagName("td")[1];
      if (td0 || td1) {
        let txt = (td0.textContent || td0.innerText) + " " + (td1.textContent || td1.innerText);
        tr[i].style.display = txt.toUpperCase().indexOf(filter) > -1 ? "" : "none";
      }
    }
  }

  async function loadProducts(){
    const res = await fetch('/api/products');
    const data = await res.json();
    const body = document.getElementById('productsBody');
    body.innerHTML = '';
    (data.products || []).forEach(p => {
      body.innerHTML += `<tr>
        <td style="padding:12px 8px; border-bottom:1px solid var(--border)"><b>${p.item_number}</b></td>
        <td style="padding:12px 8px; border-bottom:1px solid var(--border)">${p.name}</td>
        <td style="padding:12px 8px; border-bottom:1px solid var(--border)">${p.current_stock}</td>
        <td style="padding:12px 8px; border-bottom:1px solid var(--border)">${p.location_name}</td>
      </tr>`;
    });
  }

  async function saveProduct(){
    const p = {
      item_number: document.getElementById('p_id').value,
      name: document.getElementById('p_name').value,
      current_stock: document.getElementById('p_qty').value,
      location_name: document.getElementById('p_loc').value
    };
    await fetch('/api/products', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(p) });
    closeAddProductModal(); loadProducts();
  }

  let stockMode = 'receive';
  function openStockModal(m) { stockMode = m; document.getElementById('stockTitle').textContent = m==='receive'?'Incoming':'Outgoing'; document.getElementById('stockBackdrop').style.display='flex'; }
  function closeStockModal() { document.getElementById('stockBackdrop').style.display='none'; }
  function openAddProductModal() { document.getElementById('addProductBackdrop').style.display='flex'; }
  function closeAddProductModal() { document.getElementById('addProductBackdrop').style.display='none'; }

  async function submitStock(){
    const payload = { item_number: document.getElementById('s_id').value, amount: document.getElementById('s_qty').value };
    await fetch('/api/stock/' + stockMode, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) });
    closeStockModal(); loadProducts();
  }

  async function loadAudit(){
    const res = await fetch('/api/audit');
    const data = await res.json();
    const body = document.getElementById('auditBody');
    body.innerHTML = '';
    (data.data || []).forEach(r => {
      body.innerHTML += `<tr>
        <td style="padding:12px 8px; border-bottom:1px solid var(--border)">${r.created_at}</td>
        <td>${r.type}</td><td>${r.item_number}</td><td>${r.quantity}</td><td>${r.username}</td>
      </tr>`;
    });
  }

  function startScan(m) { alert('Camera simulation'); }
  function startScanStock(id) { alert('Camera simulation'); }
  function logout() { window.location.href = '/logout'; }
  function comingSoon(m) { alert(m + ' coming soon'); }
  async function backupToGitHub() { alert('Backup process started...'); }

  showView('dashboard');
</script>
</body>
</html>
