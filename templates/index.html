<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BTVenloStorage</title>
  <style>
    :root{
      --bg: #ffffff;
      --card: #ffffff;
      --text: #0b1b3a;
      --muted: #5b6a88;
      --border: rgba(17, 41, 84, .12);
      --blue-700: #1d4ed8;
      --blue-600: #2563eb;
      --blue-500: #3b82f6;
      --blue-100: #eaf2ff;
      --sidebar: #0f2a5f;
      --sidebar2:#123372;
      --shadow: 0 10px 30px rgba(10, 25, 60, .10);
      --radius: 16px;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      color:var(--text);
      background: var(--bg);
    }

    .app{display:flex; min-height:100vh;}

    .sidebar{
      position:sticky;
      top:0;
      height:100vh;
      width:72px;
      flex: 0 0 72px;
      background: linear-gradient(180deg, var(--sidebar), var(--sidebar2));
      color:#fff;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:10px 8px;
      gap:10px;
    }

    .nav{
      width:100%;
      display:flex;
      flex-direction:column;
      gap:10px;
      margin-top:6px;
      flex: 1;
      align-items:center;
    }

    .navbtn{
      width:52px;
      height:52px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      user-select:none;
      font-size:22px;
      transition: transform .05s ease, background .15s ease;
    }
    .navbtn:active{transform:scale(.98)}
    .navbtn:hover{background: rgba(255,255,255,.10)}
    .navbtn.active{background: rgba(59,130,246,.26); border-color: rgba(255,255,255,.22)}

    .navbottom{width:100%; display:flex; flex-direction:column; gap:10px; align-items:center; padding-bottom:6px;}

    .main{flex:1; min-width:0;}

    .topbar{
      position:sticky;
      top:0;
      z-index:10;
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(10px);
      border-bottom:1px solid var(--border);
    }

    .topbar-inner{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:14px 16px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      font-weight:800;
      letter-spacing:.2px;
      font-size:20px;
    }

    .brand-dot{
      width:12px;height:12px;border-radius:999px;
      background: var(--blue-600);
      box-shadow: 0 0 0 5px rgba(37,99,235,.18);
    }

    .btn{
      border:1px solid var(--border);
      background: #fff;
      color: var(--text);
      padding:10px 12px;
      border-radius: 12px;
      cursor:pointer;
      font-weight:600;
    }
    .btn.primary{
      background: var(--blue-600);
      border-color: rgba(37,99,235,.35);
      color:#fff;
    }

    .container{
      max-width:1100px;
      margin: 0 auto;
      padding:16px;
    }

    .card{
      background: var(--card);
      border:1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding:16px;
      margin-bottom: 20px;
    }

    .pillgrid{
      display:grid;
      grid-template-columns: 1fr;
      gap:12px;
    }

    .pill{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:14px;
      border:1px solid var(--border);
      border-radius: 14px;
      background: #fff;
      cursor:pointer;
      font-weight:700;
    }
    .pill:hover{background: var(--blue-100)}
    .pill .ic{width:32px;height:32px;border-radius:12px;background: var(--blue-100); display:flex;align-items:center;justify-content:center; font-size:18px; margin-right: 12px;}

    .modal-backdrop{
      position:fixed;
      inset:0;
      background: rgba(10,25,60,.35);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:50;
      padding:16px;
    }
    .modal{
      width: min(560px, 100%);
      background:#fff;
      border-radius: 18px;
      border:1px solid var(--border);
      box-shadow: 0 20px 60px rgba(0,0,0,.18);
      overflow:hidden;
    }
    .modal-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:14px 16px;
      border-bottom:1px solid var(--border);
      background: #fbfdff;
    }
    .modal-body{padding:16px}
    .row{margin-bottom:12px}
    input{
      width:100%;
      padding:12px;
      border-radius: 12px;
      border:1px solid var(--border);
      outline:none;
    }
    .scanrow{display:flex; gap:10px}
    .alert{margin-top:10px; padding:10px 12px; border-radius: 12px; border:1px solid var(--border); background:#f7fbff; color: var(--text); font-size:13px; display:none}
    .alert.bad{background:#fff5f5; border-color: rgba(220,38,38,.25); color:#7a1a1a}
    .alert.ok{background:#f0fff6; border-color: rgba(22,163,74,.25); color:#0f5132}
    .scanner{display:none; margin-top:12px; border:1px solid var(--border); border-radius: 14px; overflow:hidden; background:#000;}
    video{width:100%; height:auto; display:block}
    .low-stock-alert { color: #dc2626 !important; font-weight: 800; }
  </style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="nav">
      <button class="navbtn active" id="nav-dashboard" onclick="showView('dashboard')">🏠</button>
      <button class="navbtn" id="nav-inventory" onclick="showView('inventory')">📦</button>
      <button class="navbtn" id="nav-audit" onclick="showView('audit')">✅</button>
      <button class="navbtn" id="nav-admin" onclick="showView('admin')">⚙️</button>
    </div>
    <div class="navbottom"><button class="navbtn" onclick="logout()">🚪</button></div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand"><span class="brand-dot"></span><span>BTVenloStorage</span></div>
      </div>
    </header>

    <div class="container">
      <section id="view-dashboard" class="view">
        <div class="card">
          <h2>Dashboard</h2>
          {% if current_user.is_admin %}
          <div id="lowStockDashboardAlert" class="alert bad" style="margin-bottom: 20px; cursor: pointer;" onclick="showView('inventory')"></div>
          {% endif %}
          <div class="pillgrid">
            <div class="pill" onclick="openAddProductModal()">
              <div style="display:flex; align-items:center;"><div class="ic">➕</div><div>Add Product</div></div>
            </div>
            <div class="pill" onclick="openStockModal('receive')">
              <div style="display:flex; align-items:center;"><div class="ic">⬇️</div><div>Receive Material</div></div>
            </div>
            <div class="pill" onclick="openStockModal('issue')">
              <div style="display:flex; align-items:center;"><div class="ic">⬆️</div><div>Issue Material</div></div>
            </div>
          </div>
        </div>
      </section>

      <section id="view-inventory" class="view" style="display:none">
        <div class="card">
          <h2>Inventory</h2>
          <input type="text" id="inventorySearch" placeholder="Search by ID, Name or Location..." onkeyup="filterInventory()" style="margin-bottom:12px">
          <div style="overflow:auto">
            <table style="width:100%; border-collapse:collapse; font-size:14px">
              <thead>
                <tr style="text-align:left; color:var(--muted)">
                  <th style="padding:10px 8px; border-bottom:1px solid var(--border)">ID</th>
                  <th style="padding:10px 8px; border-bottom:1px solid var(--border)">Name</th>
                  <th style="padding:10px 8px; border-bottom:1px solid var(--border)">Qty</th>
                  <th style="padding:10px 8px; border-bottom:1px solid var(--border)">Location</th>
                </tr>
              </thead>
              <tbody id="productsBody"></tbody>
            </table>
          </div>
          <div id="productsEmpty" class="small" style="display:none; margin-top:10px">No products found.</div>
        </div>
      </section>

      <section id="view-audit" class="view" style="display:none">
        <div class="card">
          <h2>Audit Logs</h2>
          <div style="overflow:auto">
            <table style="width:100%; border-collapse:collapse; font-size:14px">
              <thead>
                <tr style="text-align:left; color:var(--muted)">
                  <th style="padding:8px; border-bottom:1px solid var(--border)">Time</th>
                  <th style="padding:8px; border-bottom:1px solid var(--border)">Action</th>
                  <th style="padding:8px; border-bottom:1px solid var(--border)">ID</th>
                  <th style="padding:8px; border-bottom:1px solid var(--border)">Qty</th>
                  <th style="padding:8px; border-bottom:1px solid var(--border)">User</th>
                </tr>
              </thead>
              <tbody id="auditBody"></tbody>
            </table>
          </div>
        </div>
      </section>

      <section id="view-admin" class="view" style="display:none">
        <div class="card">
          <h2>Admin Controls</h2>
          <button class="btn primary" onclick="downloadExcelBackup()">📥 Download Excel Backup</button>
        </div>
      </section>
    </div>

    <div class="modal-backdrop" id="addProductBackdrop">
      <div class="modal">
        <div class="modal-header"><b>Add New Product</b><button class="btn" onclick="closeAddProductModal()">✕</button></div>
        <div class="modal-body">
          <div class="row"><label>ID</label><div class="scanrow"><input id="p_id"><button class="btn" onclick="startScan('product')">Scan</button></div></div>
          <div class="row"><label>Name</label><input id="p_name"></div>
          <div class="row"><label>Initial Qty</label><input id="p_qty" type="number" value="0"></div>
          <div class="row"><label>Min Stock Level</label><input id="p_min_stock" type="number" value="0"></div>
          <div class="row"><label>Location</label><div class="scanrow"><input id="p_loc"><button class="btn" onclick="startScan('location')">Scan</button></div></div>
          <div class="scanner" id="scannerBox"><video id="video" playsinline></video></div>
          <div id="addAlert" class="alert"></div>
          <div id="addAlert" class="alert bad" style="display:none; margin-bottom: 10px;"></div>
        </div>
        <div class="modal-footer"><button class="btn primary" onclick="saveProduct()">Save Product</button></div>
      </div>
    </div>

    <div class="modal-backdrop" id="stockBackdrop">
      <div class="modal">
        <div class="modal-header"><b id="stockTitle">Stock</b><button class="btn" onclick="closeStockModal()">✕</button></div>
        <div class="modal-body">
          <div class="row">
            <label>Product ID</label>
            <div class="scanrow">
              <input id="s_id" list="products-list" oninput="checkCurrentStock(this.value)">
              <datalist id="products-list"></datalist> <button class="btn" onclick="startScanStock('s_id')">Scan</button>
            </div>
          </div>
          <div id="stock_info" class="small" style="margin: 8px 0; font-weight:bold; line-height: 1.4;"></div>
          <div class="row"><label>Quantity</label><input id="s_qty" type="number"></div>
          <div class="scanner" id="stockScannerBox"><video id="stockVideo" playsinline></video></div>
          <div id="stockAlert" class="alert"></div>
        </div>
        <div class="modal-footer"><button class="btn primary" onclick="submitStock()">Save Changes</button></div>
      </div>
    </div>
  </main>
</div>

<script>
  // Tu znajduje się cała logika JS (taka sama jak w poprzednim kroku, ale wkomponowana w Twój layout)
  let scanStream, scanTimer, scanDetector;
  let stockStream, stockScanTimer, stockDetector;
  let currentStockMode = 'receive';

  function showView(name){
    document.querySelectorAll('.view').forEach(v => v.style.display = 'none');
    document.querySelectorAll('.navbtn').forEach(b => b.classList.remove('active'));
    document.getElementById('view-'+name).style.display = 'block';
    document.getElementById('nav-'+name).classList.add('active');
    if(name==='inventory'||name==='dashboard') loadProducts();
    if(name==='audit') loadAudit();
  }

  async function loadProducts(){
    try {
      const res = await fetch('/api/products');
      const data = await res.json();
      const items = data.data || [];
      const datalist = document.getElementById('products-list');
      if(datalist) {
        datalist.innerHTML = '';
        items.forEach(p => {
          const option = document.createElement('option');
          option.value = p.item_number;
          option.textContent = p.name; // Pokaże nazwę obok ID w sugestiach
          datalist.appendChild(option);
        });
      }
      const alertBox = document.getElementById('lowStockDashboardAlert');
      if(alertBox){
        if(data.low_stock_count > 0){
          alertBox.style.display = 'block';
          alertBox.innerHTML = `⚠️ <strong>${data.low_stock_count}</strong> products reach minimum stock! Click to check.`;
        } else { alertBox.style.display = 'none'; }
      }
      const body = document.getElementById('productsBody');
      body.innerHTML = '';
      items.forEach(p => {
        const isLow = (p.min_stock > 0 && Number(p.current_stock) <= Number(p.min_stock));
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td style="padding:10px 8px; border-bottom:1px solid var(--border)">${p.item_number}</td>
          <td style="padding:10px 8px; border-bottom:1px solid var(--border)">${p.name}</td>
          <td style="padding:10px 8px; border-bottom:1px solid var(--border)" class="${isLow?'low-stock-alert':''}">
            ${isLow?'⚠️ ':''}${p.current_stock} <span style="font-size:10px; opacity:0.6"> (min: ${p.min_stock})</span>
          </td>
          <td style="padding:10px 8px; border-bottom:1px solid var(--border)">${p.location}</td>
        `;
        body.appendChild(tr);
      });
    } catch(e) {}
  }

  async function loadAudit(){
    try {
      const res = await fetch('/api/audit');
      const data = await res.json();
      const items = data.audit || [];
      const body = document.getElementById('auditBody');
      body.innerHTML = '';
      items.forEach(r => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td style="padding:8px; border-bottom:1px solid var(--border)">${r.created_at.split('.')[0]}</td><td style="padding:8px; border-bottom:1px solid var(--border)">${r.action}</td><td style="padding:8px; border-bottom:1px solid var(--border)">${r.item_number}</td><td style="padding:8px; border-bottom:1px solid var(--border)">${r.qty}</td><td style="padding:8px; border-bottom:1px solid var(--border)">${r.username}</td>`;
        body.appendChild(tr);
      });
    } catch(e) {}
  }

  async function startScan(mode){
    if(!('BarcodeDetector' in window)) return alert("Scanner not supported in this browser.");
    scanDetector = new BarcodeDetector({ formats: ['qr_code'] });
    scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    const v = document.getElementById('video'); v.srcObject = scanStream; v.play();
    document.getElementById('scannerBox').style.display = 'block';
    scanTimer = setInterval(async () => {
      const codes = await scanDetector.detect(v);
      if(codes.length){
        const val = codes[0].rawValue;
        if(mode==='location') document.getElementById('p_loc').value = val;
        else { const parts = val.split('|'); document.getElementById('p_id').value = parts[0]; if(parts[1]) document.getElementById('p_name').value = parts[1]; }
        stopScan();
      }
    }, 300);
  }
  function stopScan(){ if(scanStream) scanStream.getTracks().forEach(t=>t.stop()); clearInterval(scanTimer); document.getElementById('scannerBox').style.display='none'; }

  async function startScanStock(inputId){
    if(!('BarcodeDetector' in window)) return;
    stockDetector = new BarcodeDetector({ formats: ['qr_code'] });
    stockStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    const v = document.getElementById('stockVideo'); v.srcObject = stockStream; v.play();
    document.getElementById('stockScannerBox').style.display = 'block';
    stockScanTimer = setInterval(async () => {
      const codes = await stockDetector.detect(v);
      if(codes.length){
        const id = codes[0].rawValue.split('|')[0];
        document.getElementById(inputId).value = id;
        checkCurrentStock(id);
        stopStockScan();
      }
    }, 300);
  }
  function stopStockScan(){ if(stockStream) stockStream.getTracks().forEach(t=>t.stop()); clearInterval(stockScanTimer); document.getElementById('stockScannerBox').style.display='none'; }

  function openAddProductModal(){ 
    document.getElementById('addAlert').style.display = 'none';
    document.getElementById('addProductBackdrop').style.display = 'flex'; 
  }
  function closeAddProductModal(){ 
    stopScan(); 
    // Czyszczenie wszystkich pól przy zamknięciu
    document.getElementById('p_id').value = "";
    document.getElementById('p_name').value = "";
    document.getElementById('p_qty').value = "0";
    document.getElementById('p_min_stock').value = "0";
    document.getElementById('p_loc').value = "";
    document.getElementById('addAlert').style.display = 'none';
    document.getElementById('addProductBackdrop').style.display = 'none'; 
  }
  function closeStockModal(){ 
    stopStockScan(); 
    document.getElementById('stockBackdrop').style.display = 'none';
    // Auto-clean pól po zamknięciu
    document.getElementById('s_id').value = "";
    document.getElementById('s_qty').value = "";
    document.getElementById('stock_info').innerHTML = "";
    document.getElementById('stockAlert').style.display = 'none';
}

  async function checkCurrentStock(id){
    const info = document.getElementById('stock_info');
    if(!id || id.trim() === "") {
      info.innerHTML = "";
      return;
    }
    try {
      const res = await fetch('/api/products');
      const data = await res.json();
      const p = data.data.find(x => String(x.item_number) === id.trim());
      
      if(p) { 
        info.innerHTML = `
          <div style="color:var(--blue-600)">📍 Location: <span style="color:var(--text)">${p.location || 'Not set'}</span></div>
          <div style="color:var(--blue-600)">📦 Current Stock: <span style="color:var(--text)">${p.current_stock} ${p.unit || 'pcs'}</span></div>
          <div style="font-size: 0.9em; margin-top:4px; color:var(--muted)">Product: ${p.name}</div>
        `;
      } else { 
        info.innerHTML = `<span style="color:red">Product not found</span>`; 
      }
    } catch(e) {
      console.error("Error fetching stock info:", e);
    }
  }

  async function saveProduct(){
    const id = document.getElementById('p_id').value.trim();
    const alertBox = document.getElementById('addAlert');
    
    if(!id) {
        alertBox.textContent = "Product ID is required.";
        alertBox.style.display = "block";
        return;
    }

    // 1. Sprawdzenie czy produkt już istnieje (pobieramy aktualną listę)
    const resCheck = await fetch('/api/products');
    const data = await resCheck.json();
    const exists = data.data.find(x => String(x.item_number) === id);

    if(exists) {
        alertBox.textContent = "Product already exists! Redirecting to Receive Materials...";
        alertBox.style.display = "block";
        
        // Czekamy 2 sekundy, żeby użytkownik przeczytał info, a potem przełączamy modal
        setTimeout(() => {
            closeAddProductModal();
            openStockModal('receive');
            // Automatycznie wpisujemy ID do nowego modala
            document.getElementById('s_id').value = id;
            checkCurrentStock(id);
        }, 2000);
        return;
    }

    // 2. Jeśli nie istnieje - zapisujemy
    const body = { 
        item_number: id, 
        name: document.getElementById('p_name').value, 
        current_stock: document.getElementById('p_qty').value, 
        min_stock: document.getElementById('p_min_stock').value, 
        location: document.getElementById('p_loc').value, 
        unit: 'pcs' 
    };

    const resSave = await fetch('/api/products', { 
        method: 'POST', 
        headers: {'Content-Type': 'application/json'}, 
        body: JSON.stringify(body) 
    });

    if(resSave.ok) {
        closeAddProductModal(); 
        loadProducts();
    } else {
        alertBox.textContent = "Error saving product. Please try again.";
        alertBox.style.display = "block";
    }
  }

  async function submitStock(){
    const id = document.getElementById('s_id').value;
    const amount = parseInt(document.getElementById('s_qty').value);
    const alertBox = document.getElementById('stockAlert');

    if(!id || !amount || amount <= 0) {
        alertBox.textContent = "Please enter valid ID and amount.";
        alertBox.className = "alert bad";
        alertBox.style.display = "block";
        return;
    }

    // Blokada zejścia poniżej 0 dla wydawania (ISSUE)
    if(currentStockMode === 'issue') {
        const res = await fetch('/api/products');
        const data = await res.json();
        const p = data.data.find(x => String(x.item_number) === id.trim());
        
        if(p && amount > p.current_stock) {
            alertBox.textContent = `Error: Not enough stock! Current: ${p.current_stock}`;
            alertBox.className = "alert bad";
            alertBox.style.display = "block";
            return;
        }
    }

    const res = await fetch('/api/stock/'+currentStockMode, { 
        method: 'POST', 
        headers: {'Content-Type': 'application/json'}, 
        body: JSON.stringify({ item_number: id, amount: amount }) 
    });

    if(res.ok){ 
        closeStockModal(); 
        loadProducts(); 
    } else { 
        alertBox.textContent = "Error: Check stock levels or product ID.";
        alertBox.className = "alert bad";
        alertBox.style.display = "block";
    }
}

  function filterInventory() {
    const val = document.getElementById('inventorySearch').value.toLowerCase();
    document.querySelectorAll('#productsBody tr').forEach(tr => { tr.style.display = tr.textContent.toLowerCase().includes(val) ? '' : 'none'; });
  }

  function logout(){ window.location.href = '/logout'; }
  function downloadExcelBackup(){ window.location.href = '/api/admin/export/excel'; }
  window.onload = loadProducts;
</script>
</body>
</html>
