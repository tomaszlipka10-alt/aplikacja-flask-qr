<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BTVenloStorage</title>
  <style>
    :root{
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0b1b3a;
      --muted: #64748b;
      --border: #e2e8f0;
      --blue-600: #2563eb;
      --sidebar: #0f172a;
      --radius: 12px;
    }
    *{box-sizing:border-box}
    body{margin:0; font-family: sans-serif; background: var(--bg); color: var(--text); display: flex; height: 100vh;}
    
    .sidebar{width: 260px; background: var(--sidebar); color: white; padding: 20px; display: flex; flex-direction: column;}
    .sidebar h2{font-size: 1.2rem; margin-bottom: 30px;}
    .nav-btn{background: none; border: none; color: #cbd5e1; padding: 12px; text-align: left; cursor: pointer; width: 100%; font-size: 1rem; border-radius: 8px;}
    .nav-btn:hover, .nav-btn.active{background: rgba(255,255,255,0.1); color: white;}
    
    .main{flex: 1; padding: 30px; overflow-y: auto;}
    .view{display: none;}
    .view.active{display: block;}
    
    .card{background: white; padding: 20px; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 20px;}
    
    table{width: 100%; border-collapse: collapse; margin-top: 10px;}
    th, td{text-align: left; padding: 12px; border-bottom: 1px solid var(--border);}
    th{background: #f1f5f9; font-weight: 600;}
    
    input, select{width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 15px;}
    .btn-action{background: var(--blue-600); color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; width: 100%;}
    
    .badge{padding: 4px 8px; border-radius: 6px; font-size: 0.8rem; font-weight: bold;}
    .badge-in{background: #dcfce7; color: #166534;}
    .badge-out{background: #fee2e2; color: #991b1b;}
  </style>
</head>
<body>

<div class="sidebar">
  <h2>BTVenlo Storage</h2>
  <button class="nav-btn active" onclick="showView('scan')">📦 Receive / Release</button>
  <button class="nav-btn" onclick="showView('inventory')">📊 Inventory</button>
  <button class="nav-btn" onclick="showView('audit')">🕒 Audit Logs</button>
  <div style="margin-top: auto;">
    <button class="nav-btn" onclick="location.href='/logout'">🚪 Logout</button>
  </div>
</div>

<div class="main">
  <div id="view-scan" class="view active">
    <h1>Stock Operation</h1>
    <div class="card">
      <label>Product SKU</label>
      <input type="text" id="p_id" placeholder="Scan or type SKU...">
      <label>Operation Type</label>
      <select id="p_action">
        <option value="receive">RECEIVE (Add to stock)</option>
        <option value="release">RELEASE (Take from stock)</option>
      </select>
      <label>Amount</label>
      <input type="number" id="p_amount" value="1" min="1">
      <button class="btn-action" onclick="submitStock()">Submit Operation</button>
    </div>
  </div>

  <div id="view-inventory" class="view">
    <h1>Current Inventory</h1>
    <div class="card">
      <table>
        <thead>
          <tr>
            <th>SKU</th>
            <th>Name</th>
            <th>Location</th>
            <th>Stock</th>
          </tr>
        </thead>
        <tbody id="inventory-list"></tbody>
      </table>
    </div>
  </div>

  <div id="view-audit" class="view">
    <h1>Audit Logs</h1>
    <div class="card">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Action</th>
            <th>Product</th>
            <th>Qty</th>
            <th>User</th>
          </tr>
        </thead>
        <tbody id="audit-list"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  function showView(viewId) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('view-' + viewId).classList.add('active');
    
    if(viewId === 'inventory') loadInventory();
    if(viewId === 'audit') loadAudit();
  }

  async function loadInventory() {
    const res = await fetch('/api/products');
    const json = await res.json();
    const tbody = document.getElementById('inventory-list');
    tbody.innerHTML = '';
    json.data.forEach(p => {
      tbody.innerHTML += `<tr>
        <td><b>${p.item_number}</b></td>
        <td>${p.name}</td>
        <td>${p.location}</td>
        <td>${p.current_stock}</td>
      </tr>`;
    });
  }

  async function loadAudit() {
    const res = await fetch('/api/audit');
    const json = await res.json();
    const tbody = document.getElementById('audit-list');
    tbody.innerHTML = '';
    json.data.forEach(l => {
      const badgeClass = l.type === 'RECEIVE' ? 'badge-in' : 'badge-out';
      tbody.innerHTML += `<tr>
        <td>${new Date(l.created_at).toLocaleString()}</td>
        <td><span class="badge ${badgeClass}">${l.type}</span></td>
        <td>${l.item_number} - ${l.name}</td>
        <td>${l.amount}</td>
        <td>${l.username}</td>
      </tr>`;
    });
  }

  async function submitStock() {
    const sku = document.getElementById('p_id').value;
    const action = document.getElementById('p_action').value;
    const amount = document.getElementById('p_amount').value;

    if(!sku) { alert('Enter SKU'); return; }

    const res = await fetch('/api/stock', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ item_number: sku, action: action, amount: amount })
    });

    const data = await res.json();
    if(data.ok) {
      alert('Success! New stock: ' + data.current_stock);
      document.getElementById('p_id').value = '';
      loadInventory(); // Refresh background data
    } else {
      alert('Error: ' + data.error);
    }
  }
</script>

</body>
</html>
