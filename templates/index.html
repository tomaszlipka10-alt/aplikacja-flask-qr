<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BTV Inventory</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: Arial, sans-serif;
            background:#0f172a;
            color:#e5e7eb;
            margin:0;
        }
        header {
            padding:16px;
            background:#020617;
            text-align:center;
            font-size:22px;
            font-weight:bold;
        }
        .dashboard {
            display:grid;
            grid-template-columns: repeat(auto-fit, minmax(200px,1fr));
            gap:16px;
            padding:20px;
        }
        .tile {
            background:#020617;
            border:1px solid #1e293b;
            border-radius:12px;
            padding:40px 20px;
            text-align:center;
            font-size:20px;
            cursor:pointer;
            transition:.2s;
        }
        .tile:hover {
            background:#020617;
            border-color:#38bdf8;
        }
        .hidden { display:none; }

        .panel {
            padding:20px;
        }
        button {
            background:#38bdf8;
            color:#020617;
            border:none;
            padding:10px 16px;
            border-radius:8px;
            cursor:pointer;
            font-size:14px;
            margin-right:8px;
        }
        button.secondary {
            background:#64748b;
            color:white;
        }
        table {
            width:100%;
            border-collapse:collapse;
            margin-top:16px;
        }
        th, td {
            border:1px solid #1e293b;
            padding:8px;
            text-align:left;
        }
        th {
            background:#020617;
        }
        input {
            padding:8px;
            border-radius:6px;
            border:1px solid #1e293b;
            background:#020617;
            color:white;
            margin-right:8px;
        }
    </style>
</head>
<body>

<header>BTV Inventory</header>

<div class="dashboard" id="dashboard">
    <div class="tile" onclick="openPanel('receive')">Receive</div>
    <div class="tile" onclick="openPanel('issue')">Issue</div>
    <div class="tile" onclick="openPanel('inventory')">Inventory</div>
    <div class="tile" onclick="openPanel('audit')">Audit</div>
</div>

<div class="panel hidden" id="receive">
    <h2>Receive</h2>
    <input id="r_item" placeholder="Item number">
    <input id="r_name" placeholder="Name">
    <input id="r_qty" type="number" placeholder="Qty">
    <input id="r_loc" placeholder="Location">
    <br><br>
    <button onclick="saveReceive()">Receive</button>
    <button class="secondary" onclick="saveDelivery()">Delivery</button>
    <button class="secondary" onclick="goBack()">Back</button>
</div>

<div class="panel hidden" id="issue">
    <h2>Issue</h2>
    <input id="i_item" placeholder="Item number">
    <input id="i_qty" type="number" placeholder="Qty">
    <br><br>
    <button onclick="saveIssue()">Issue</button>
    <button class="secondary" onclick="goBack()">Back</button>
</div>

<div class="panel hidden" id="inventory">
    <h2>Inventory</h2>
    <table>
        <thead>
        <tr>
            <th>Item</th>
            <th>Name</th>
            <th>Qty</th>
            <th>Location</th>
        </tr>
        </thead>
        <tbody id="inventoryBody"></tbody>
    </table>
    <br>
    <button class="secondary" onclick="goBack()">Back</button>
</div>

<div class="panel hidden" id="audit">
    <h2>Audit</h2>
    <table>
        <thead>
        <tr>
            <th>Time</th>
            <th>Type</th>
            <th>Item</th>
            <th>Qty</th>
            <th>Location</th>
        </tr>
        </thead>
        <tbody id="auditBody"></tbody>
    </table>
    <br>
    <button class="secondary" onclick="goBack()">Back</button>
</div>

<script>
function openPanel(id){
    document.getElementById('dashboard').classList.add('hidden');
    document.querySelectorAll('.panel').forEach(p=>p.classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');
    if(id==='inventory') loadInventory();
    if(id==='audit') loadAudit();
}

function goBack(){
    document.getElementById('dashboard').classList.remove('hidden');
    document.querySelectorAll('.panel').forEach(p=>p.classList.add('hidden'));
}

async function saveReceive(){
    const res = await fetch('/api/products',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
            item_number: document.getElementById('r_item').value,
            name: document.getElementById('r_name').value,
            current_stock: document.getElementById('r_qty').value,
            location_name: document.getElementById('r_loc').value,
            action:'receive'
        })
    });
    if(res.ok) alert('Received');
    else alert('Error saving product');
}

async function saveDelivery(){
    const res = await fetch('/api/stock/receive',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
            item_number: document.getElementById('r_item').value,
            qty: document.getElementById('r_qty').value
        })
    });
    if(res.ok) alert('Delivery saved');
    else alert('Error during delivery');
}

async function saveIssue(){
    const res = await fetch('/api/stock/issue',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
            item_number: document.getElementById('i_item').value,
            qty: document.getElementById('i_qty').value
        })
    });
    if(res.ok) alert('Issued');
    else {
        const err = await res.json();
        alert('Error: ' + (err.error || 'Check stock'));
    }
}

async function loadInventory(){
    const res = await fetch('/api/products');
    const json = await res.json();
    const inventoryBody = document.getElementById('inventoryBody');
    inventoryBody.innerHTML='';
    (json.products||[]).forEach(p=>{
        inventoryBody.innerHTML+=`<tr>
            <td>${p.item_number}</td>
            <td>${p.name}</td>
            <td>${p.current_stock}</td>
            <td>${p.location_name}</td>
        </tr>`;
    });
}

async function loadAudit(){
    const res = await fetch('/api/audit');
    if(!res.ok) return;
    const json = await res.json();
    const auditBody = document.getElementById('auditBody');
    auditBody.innerHTML='';
    (json.data||[]).forEach(a=>{
        auditBody.innerHTML+=`<tr>
            <td>${a.created_at}</td>
            <td>${a.action || a.type}</td>
            <td>${a.item_number}</td>
            <td>${a.qty || a.quantity}</td>
            <td>${a.location || a.location_name || ''}</td>
        </tr>`;
    });
}
</script>

</body>
</html>
