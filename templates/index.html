<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BTVenloStorage</title>
  <style>
    :root{
      --bg: #ffffff; --card: #ffffff; --text: #0b1b3a; --muted: #5b6a88;
      --border: rgba(17, 41, 84, .12); --blue-700: #1d4ed8; --blue-600: #2563eb;
      --blue-500: #3b82f6; --blue-100: #eaf2ff; --sidebar: #0f2a5f;
      --sidebar2:#123372; --shadow: 0 10px 30px rgba(10, 25, 60, .10); --radius: 16px;
    }
    *{box-sizing:border-box}
    body{ margin:0; font-family: ui-sans-serif, system-ui, sans-serif; color:var(--text); background: var(--bg); }
    .app{display:flex; min-height:100vh;}
    .sidebar{ position:sticky; top:0; height:100vh; width:72px; background: linear-gradient(180deg, var(--sidebar), var(--sidebar2)); color:#fff; display:flex; flex-direction:column; align-items:center; padding:10px 8px; gap:10px; }
    .nav{ width:100%; display:flex; flex-direction:column; gap:10px; margin-top:6px; flex: 1; align-items:center; }
    .navbtn{ width:52px; height:52px; border-radius:14px; border:1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.06); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:22px; }
    .navbtn.active{background: rgba(59,130,246,.26); border-color: rgba(255,255,255,.22)}
    .main{flex:1; min-width:0;}
    .topbar{ position:sticky; top:0; z-index:10; background: rgba(255,255,255,.92); backdrop-filter: blur(10px); border-bottom:1px solid var(--border); }
    .topbar-inner{ display:flex; align-items:center; justify-content:space-between; padding:14px 16px; max-width: 1100px; margin: 0 auto; }
    .brand{ display:flex; align-items:center; gap:10px; font-weight:800; font-size:20px; }
    .brand-dot{ width:12px;height:12px;border-radius:999px; background: var(--blue-600); }
    .btn{ border:1px solid var(--border); background: #fff; padding:10px 12px; border-radius: 12px; cursor:pointer; font-weight:600; }
    .btn.primary{ background: var(--blue-600); color:#fff; }
    .container{ max-width:1100px; margin: 0 auto; padding:16px; }
    .card{ background: var(--card); border:1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding:16px; margin-bottom: 20px; }
    .pillgrid{ display:grid; grid-template-columns: 1fr; gap:12px; }
    .pill{ display:flex; align-items:center; justify-content:space-between; padding:14px; border:1px solid var(--border); border-radius: 14px; background: #fff; cursor:pointer; font-weight:700; }
    .pill .ic{ width:32px; height:32px; border-radius:12px; background: var(--blue-100); display:flex; align-items:center; justify-content:center; margin-right: 12px; }
    .modal-backdrop{ position:fixed; inset:0; background: rgba(10,25,60,.35); display:none; align-items:center; justify-content:center; z-index:50; padding:16px; }
    .modal{ width: min(560px, 100%); background:#fff; border-radius: 18px; border:1px solid var(--border); overflow:hidden; }
    .modal-header{ display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--border); background: #fbfdff; }
    .modal-body{padding:16px}
    .row{margin-bottom:12px}
    input, select{ width:100%; padding:12px; border-radius: 12px; border:1px solid var(--border); }
    .scanrow{display:flex; gap:10px}
    .alert{margin-top:10px; padding:10px 12px; border-radius: 12px; border:1px solid var(--border); display:none}
    .alert.bad{background:#fff5f5; color:#7a1a1a}
    .scanner{display:none; margin-top:12px; border:1px solid var(--border); border-radius: 14px; overflow:hidden; background:#000;}
    video{width:100%; height:auto; display:block}
    .low-stock-alert { color: #dc2626 !important; font-weight: 800; }
  </style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="nav">
      <button class="navbtn active" id="nav-dashboard" onclick="showView('dashboard')">🏠</button>
      <button class="navbtn" id="nav-inventory" onclick="showView('inventory')">📦</button>
      <button class="navbtn" id="nav-audit" onclick="showView('audit')">✅</button>
      <button class="navbtn" id="nav-admin" onclick="showView('admin')">⚙️</button>
    </div>
    <div class="navbottom"><button class="navbtn" onclick="logout()">🚪</button></div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand"><span class="brand-dot"></span><span>BTVenloStorage</span></div>
      </div>
    </header>

    <div class="container">
      <section id="view-dashboard" class="view">
        <div class="card">
          <h2>Dashboard</h2>
          {% if current_user.is_admin %}
          <div id="lowStockDashboardAlert" class="alert bad" style="margin-bottom: 20px; cursor: pointer;" onclick="showView('inventory')"></div>
          {% endif %}
          <div class="pillgrid">
            <div class="pill" onclick="openAddProductModal()"><div style="display:flex; align-items:center;"><div class="ic">➕</div><div>Add Product</div></div></div>
            <div class="pill" onclick="openStockModal('receive')"><div style="display:flex; align-items:center;"><div class="ic">⬇️</div><div>Receive Material</div></div></div>
            <div class="pill" onclick="openStockModal('issue')"><div style="display:flex; align-items:center;"><div class="ic">⬆️</div><div>Issue Material</div></div></div>
            <div class="pill" onclick="openRelocateModal()"><div style="display:flex; align-items:center;"><div class="ic">🔄</div><div>Relocate Material</div></div></div>
          </div>
        </div>
      </section>

      <section id="view-inventory" class="view" style="display:none">
        <div class="card">
          <h2>Inventory</h2>
          <div style="display:flex; gap:10px; margin-bottom:12px;">
            <input type="text" id="inventorySearch" placeholder="Search ID, Name, Location or Project..." onkeyup="filterInventory()">
            <select id="filterCategory" onchange="filterInventory()" style="width:150px;">
              <option value="all">All Categories</option>
              <option value="material">Materials</option>
              <option value="tool">Tools</option>
            </select>
          </div>
          <div style="overflow:auto">
            <table style="width:100%; border-collapse:collapse; font-size:14px">
              <thead>
                <tr style="text-align:left; color:var(--muted)">
                  <th style="padding:10px 8px; border-bottom:1px solid var(--border)">ID</th>
                  <th style="padding:10px 8px; border-bottom:1px solid var(--border)">Name</th>
                  <th style="padding:10px 8px; border-bottom:1px solid var(--border)">Category</th>
                  <th style="padding:10px 8px; border-bottom:1px solid var(--border)">Project</th>
                  <th style="padding:10px 8px; border-bottom:1px solid var(--border)">Qty</th>
                  <th style="padding:10px 8px; border-bottom:1px solid var(--border)">Location</th>
                </tr>
              </thead>
              <tbody id="productsBody"></tbody>
            </table>
          </div>
        </div>
      </section>

      <section id="view-audit" class="view" style="display:none">
        <div class="card">
          <h2>Audit Logs</h2>
          <div style="overflow:auto">
            <table style="width:100%; border-collapse:collapse; font-size:14px">
              <thead>
                <tr style="text-align:left; color:var(--muted)">
                  <th style="padding:8px; border-bottom:1px solid var(--border)">Time</th>
                  <th style="padding:8px; border-bottom:1px solid var(--border)">Action</th>
                  <th style="padding:8px; border-bottom:1px solid var(--border)">ID</th>
                  <th style="padding:8px; border-bottom:1px solid var(--border)">Project</th>
                  <th style="padding:8px; border-bottom:1px solid var(--border)">Qty</th>
                  <th style="padding:8px; border-bottom:1px solid var(--border)">User</th>
                  <th style="padding:8px; border-bottom:1px solid var(--border)">Note</th>
                </tr>
              </thead>
              <tbody id="auditBody"></tbody>
            </table>
          </div>
        </div>
      </section>

      <section id="view-admin" class="view" style="display:none">
        <div class="card">
          <h2>Admin</h2>
          <button class="btn primary" onclick="downloadExcelBackup()">📥 Download Excel Backup</button>
        </div>
      </section>
    </div>

    <div class="modal-backdrop" id="addProductBackdrop">
      <div class="modal">
        <div class="modal-header"><b>Add New Product</b><button class="btn" onclick="closeAddProductModal()">✕</button></div>
        <div class="modal-body">
          <div class="row"><label>ID</label><div class="scanrow"><input id="p_id"><button class="btn" onclick="startScan('product')">Scan</button></div></div>
          <div class="row"><label>Name</label><input id="p_name"></div>
          <div class="row"><label>Category</label><select id="p_category"><option value="material">Material</option><option value="tool">Tool</option></select></div>
          <div class="row"><label>Project Number</label><input id="p_project" placeholder="e.g. PRJ-2026-001"></div>
          <div class="row"><label>Qty</label><input id="p_qty" type="number" value="0"></div>
          <div class="row"><label>Min Stock</label><input id="p_min_stock" type="number" value="0"></div>
          <div class="row"><label>Location</label><div class="scanrow"><input id="p_loc"><button class="btn" onclick="startScan('location')">Scan</button></div></div>
          <div class="scanner" id="scannerBox"><video id="video" playsinline></video></div>
          <div id="addAlert" class="alert bad"></div>
        </div>
        <div class="modal-footer" style="padding:16px; border-top:1px solid var(--border
