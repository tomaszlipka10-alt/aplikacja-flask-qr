<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BTVenloStorage</title>
  <style>
    :root{
      --bg: #ffffff; --card: #ffffff; --text: #0b1b3a; --muted: #5b6a88;
      --border: rgba(17, 41, 84, .12); --blue-600: #2563eb; --blue-100: #eaf2ff;
      --sidebar: #0f2a5f; --sidebar2:#123372; --radius: 16px;
      --danger: #fff1f2; --danger-text: #e11d48;
    }
    *{box-sizing:border-box}
    body{ margin:0; font-family: system-ui, sans-serif; color:var(--text); background: var(--bg); }
    .app{display:flex; min-height:100vh;}
    .sidebar{ width:72px; background: linear-gradient(180deg, var(--sidebar), var(--sidebar2)); color:#fff; display:flex; flex-direction:column; align-items:center; padding:10px; gap:10px; }
    .navbtn{ width:52px; height:52px; border-radius:14px; border:1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.05); color:#fff; cursor:pointer; font-size:22px; }
    .navbtn.active{ background: rgba(59,130,246,.3); }
    .main{flex:1;}
    .container{ max-width:1100px; margin: 0 auto; padding:16px; }
    .card{ background: #fff; border:1px solid var(--border); border-radius: var(--radius); padding:24px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .pillgrid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:16px; }
    .pill{ display:flex; align-items:center; padding:20px; border:1px solid var(--border); border-radius: 14px; cursor:pointer; font-weight:700; }
    .pill:hover{ background: var(--blue-100); }
    .low-stock { background: var(--danger) !important; color: var(--danger-text); }
    .modal-backdrop{ position:fixed; inset:0; background: rgba(0,0,0,0.5); display:none; align-items:center; justify-content:center; z-index:100; }
    .modal{ width: min(500px, 95%); background:#fff; border-radius: 18px; padding:20px; }
    .row{ margin-bottom:15px; }
    label{ display:block; font-size:12px; font-weight:700; margin-bottom:5px; color:var(--muted); }
    input{ width:100%; padding:12px; border:1px solid var(--border); border-radius:10px; }
    .scanrow{ display:flex; gap:8px; }
    .btn{ padding:10px 15px; border-radius:10px; border:1px solid var(--border); background:#fff; cursor:pointer; font-weight:600; }
    .btn.primary{ background:var(--blue-600); color:#fff; border:none; width:100%; padding:15px; margin-top:10px; }
    .scanner-box{ display:none; margin-top:10px; border-radius:12px; overflow:hidden; background:#000; position:relative; }
    video{ width:100%; height:auto; display:block; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <button class="navbtn active" onclick="showView('dashboard')">🏠</button>
    <button class="navbtn" onclick="showView('inventory')">📦</button>
    <button class="navbtn" onclick="logout()">🚪</button>
  </aside>
  <main class="main">
    <div class="container">
      <section id="view-dashboard">
        <div class="card">
          <h2>Dashboard</h2>
          <div class="pillgrid">
            <div class="pill" onclick="openAddModal()">➕ Add Product</div>
            <div class="pill" onclick="openStockModal('receive')">⬇️ Incoming</div>
            <div class="pill" onclick="openStockModal('issue')">⬆️ Outgoing</div>
          </div>
        </div>
      </section>
      <section id="view-inventory" style="display:none">
        <div class="card">
          <h2>Inventory</h2>
          <table style="width:100%; border-collapse:collapse">
            <thead><tr style="text-align:left"><th>SKU</th><th>Name</th><th>Stock</th><th>Min</th><th>Loc</th></tr></thead>
            <tbody id="productsBody"></tbody>
          </table>
        </div>
      </section>
    </div>

    <div class="modal-backdrop" id="addBackdrop">
      <div class="modal">
        <h3>New Product</h3>
        <div class="row">
          <label>SKU</label>
          <div class="scanrow"><input id="p_id"><button class="btn" onclick="startScan('p_id', 'addScannerBox', 'addVideo')">📷</button></div>
        </div>
        <div class="row"><label>Name</label><input id="p_name"></div>
        <div class="row"><label>Min Stock</label><input id="p_min" type="number" value="5"></div>
        <div class="row">
          <label>Location</label>
          <div class="scanrow"><input id="p_loc" value="MAG-1"><button class="btn" onclick="startScan('p_loc', 'addScannerBox', 'addVideo')">📷</button></div>
        </div>
        <div class="scanner-box" id="addScannerBox"><video id="addVideo" playsinline></video></div>
        <button class="btn primary" onclick="saveProduct()">Save</button>
        <button class="btn" style="width:100%; margin-top:5px" onclick="closeModals()">Cancel</button>
      </div>
    </div>

    <div class="modal-backdrop" id="stockBackdrop">
      <div class="modal">
        <h3 id="stockTitle">Stock</h3>
        <div class="row">
          <label>SKU</label>
          <div class="scanrow"><input id="s_id"><button class="btn" onclick="startScan('s_id', 'stockScannerBox', 'stockVideo')">📷</button></div>
        </div>
        <div class="row"><label>Quantity</label><input id="s_qty" type="number"></div>
        <div class="scanner-box" id="stockScannerBox"><video id="stockVideo" playsinline></video></div>
        <button class="btn primary" onclick="submitStock()">Confirm</button>
        <button class="btn" style="width:100%; margin-top:5px" onclick="closeModals()">Cancel</button>
      </div>
    </div>
  </main>
</div>

<script>
  let scannerActive = false;
  let videoStream = null;

  function showView(n){
    document.getElementById('view-dashboard').style.display = n==='dashboard'?'block':'none';
    document.getElementById('view-inventory').style.display = n==='inventory'?'block':'none';
    if(n==='inventory') loadProducts();
  }

  async function loadProducts(){
    const res = await fetch('/api/products');
    const data = await res.json();
    const body = document.getElementById('productsBody');
    body.innerHTML = '';
    (data.products || []).forEach(p => {
      const low = p.current_stock <= p.min_stock;
      body.innerHTML += `<tr class="${low?'low-stock':''}">
        <td style="padding:10px">${p.item_number}</td><td>${p.name}</td><td>${p.current_stock}</td><td>${p.min_stock}</td><td>${p.location_name}</td>
      </tr>`;
    });
  }

  function startScan(inputId, boxId, videoId) {
    if(scannerActive) stopScan();
    const video = document.getElementById(videoId);
    const box = document.getElementById(boxId);
    box.style.display = 'block';
    
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }).then(stream => {
      videoStream = stream;
      video.srcObject = stream;
      video.setAttribute("playsinline", true);
      video.play();
      scannerActive = true;
      requestAnimationFrame(() => tick(video, inputId));
    }).catch(err => alert("Camera error: " + err));
  }

  function tick(video, inputId) {
    if (!scannerActive) return;
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      const canvas = document.createElement("canvas");
      canvas.width = video.videoWidth; canvas.height = video.videoHeight;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const code = jsQR(ctx.getImageData(0, 0, canvas.width, canvas.height).data, canvas.width, canvas.height);
      if (code) {
        document.getElementById(inputId).value = code.data;
        stopScan(); return;
      }
    }
    requestAnimationFrame(() => tick(video, inputId));
  }

  function stopScan() {
    scannerActive = false;
    if (videoStream) videoStream.getTracks().forEach(t => t.stop());
    document.querySelectorAll('.scanner-box').forEach(b => b.style.display = 'none');
  }

  function openAddModal(){ document.getElementById('addBackdrop').style.display='flex'; }
  let currentStockMode = 'receive';
  function openStockModal(m){ 
    currentStockMode = m; 
    document.getElementById('stockTitle').innerText = m==='receive'?'Incoming':'Outgoing';
    document.getElementById('stockBackdrop').style.display='flex'; 
  }
  function closeModals(){ 
    document.querySelectorAll('.modal-backdrop').forEach(m=>m.style.display='none'); 
    stopScan(); 
  }

  async function saveProduct(){
    const p = {
      item_number: document.getElementById('p_id').value,
      name: document.getElementById('p_name').value,
      min_stock: document.getElementById('p_min').value,
      current_stock: 0,
      location_name: document.getElementById('p_loc').value
    };
    await fetch('/api/products', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(p) });
    closeModals(); loadProducts();
  }

  async function submitStock(){
    const payload = { item_number: document.getElementById('s_id').value, amount: document.getElementById('s_qty').value };
    await fetch('/api/stock/' + currentStockMode, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) });
    closeModals(); loadProducts();
  }

  function logout(){ window.location.href='/logout'; }
</script>
</body>
</html>
